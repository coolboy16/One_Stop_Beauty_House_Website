<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book an Appointment | ONE STOP</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="nav"><a class="logo" href="index.html">ONE STOP <small>BEAUTY HOUSE</small></a><button class="menu">☰</button><nav><a href="index.html">Home</a><a href="index.html#services">Services</a><a href="booking.html">Book Now</a><a href="index.html#contact">Contact</a></nav></header>
<main class="booking"><div class="heading"><p class="eyebrow">APPOINTMENT</p><h1>Book your beauty session</h1><p>Submit your request and WhatsApp will open with your booking details for confirmation.</p></div>
<form id="bookingForm"><label>Full Name<input id="name" required placeholder="Your full name"></label><label>Phone Number<input id="phone" required placeholder="+231 ..."></label>
<label>Service<select id="service" required><option value="">Select a service</option><option>Braids</option><option>Wigs Installation</option><option>Manicure and Pedicure</option><option>Nails</option><option>Hair Relaxing and Washing</option></select></label>
<div class="grid"><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" required></label></div>
<label>Notes (optional)<textarea id="notes" rows="5" placeholder="Any details we should know?"></textarea></label>
<button class="btn" type="submit">Send Booking Request via WhatsApp</button><p class="note">Requests are subject to availability. Your appointment is confirmed manually by the salon.</p></form></main>
<footer>© 2026 One Stop Beauty House.</footer><script src="js/booking.js"></script></body></html>
